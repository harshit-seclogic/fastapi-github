image: google/cloud-sdk:latest

pipelines:
  default:
    - step:
        name: Build and Deploy to GKE
        services:
          - docker
        caches:
          - docker
        script:
          # 1️⃣ Decode and authenticate with GCP
          - bash -c 'echo $GCP_SA_KEY | base64 --decode > gcp-key.json'
          - bash -c 'gcloud auth activate-service-account --key-file=gcp-key.json'
          - bash -c 'gcloud config set project $GCP_PROJECT'
          - bash -c 'gcloud auth configure-docker ${GAR_LOCATION}-docker.pkg.dev -q'

          # 2️⃣ Build and push Docker image
          - export IMAGE_URI="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT}/${GAR_REPO}/${IMAGE_NAME}:${BITBUCKET_COMMIT}"
          - echo "Building Docker image"
          - docker build -t $IMAGE_URI .
          - docker push $IMAGE_URI


          # 3️⃣ Get GKE credentials
          - bash -c 'export USE_GKE_GCLOUD_AUTH_PLUGIN=True && gcloud container clusters get-credentials $GKE_CLUSTER --zone $GKE_ZONE --project $GCP_PROJECT'

          # 4️⃣ Deploy to Kubernetes
          - bash -c 'kubectl apply -f k8s/namespace.yaml'
          - bash -c "sed 's|REPLACE_WITH_IMAGE|$IMAGE_URI|g' k8s/deployment.yaml | kubectl apply -f -"
          - bash -c 'kubectl apply -f k8s/service.yaml'
          - bash -c 'kubectl apply -f k8s/hpa.yaml'

definitions:
  services:
    docker:
      memory: 3072
