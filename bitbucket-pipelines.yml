image: google/cloud-sdk:latest

pipelines:
  default:
    - step:
        name: Build and Deploy to GKE
        services:
          - docker
        caches:
          - docker
        script:
          # Decode and authenticate with GCP
          - echo $GCP_SA_KEY | base64 --decode > gcp-key.json
          - gcloud auth activate-service-account --key-file=gcp-key.json
          - gcloud config set project $GCP_PROJECT
          - gcloud auth configure-docker ${GAR_LOCATION}-docker.pkg.dev -q

          # Build Docker image with Bitbucket metadata
          - export IMAGE_URI="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT}/${GAR_REPO}/${IMAGE_NAME}:${BITBUCKET_COMMIT}"
          - echo "=========================================="
          - 'echo "Building Docker image: $IMAGE_URI"'
          - 'echo "Repository: $BITBUCKET_REPO_FULL_NAME"'
          - 'echo "Project ID: $BITBUCKET_PROJECT_KEY"'
          - echo "=========================================="
          - |
            docker build \
              --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
              --build-arg VCS_REF=${BITBUCKET_COMMIT} \
              --build-arg VERSION=${BITBUCKET_BUILD_NUMBER} \
              --build-arg BITBUCKET_REPO_NAME=${BITBUCKET_REPO_SLUG} \
              --build-arg BITBUCKET_PROJECT_ID=${BITBUCKET_PROJECT_KEY} \
              --build-arg BITBUCKET_REPO_OWNER=${BITBUCKET_REPO_OWNER} \
              --build-arg BITBUCKET_REPO_FULL_NAME=${BITBUCKET_REPO_FULL_NAME} \
              --build-arg BITBUCKET_BRANCH=${BITBUCKET_BRANCH} \
              --build-arg BITBUCKET_COMMIT=${BITBUCKET_COMMIT} \
              --build-arg BITBUCKET_BUILD_NUMBER=${BITBUCKET_BUILD_NUMBER} \
              --build-arg BITBUCKET_TRIGGERER=${BITBUCKET_STEP_TRIGGERER_UUID} \
              -t $IMAGE_URI .
          
          # Push image to GAR
          - echo "=========================================="
          - echo "Pushing image to Artifact Registry..."
          - echo "=========================================="
          - docker push $IMAGE_URI
          
          # Describe image and show labels in JSON format
          - echo "=========================================="
          - echo "Image Labels (JSON Format):"
          - echo "=========================================="
          - |
            gcloud artifacts docker images describe $IMAGE_URI --format=json > /tmp/image_info.json
            python3 << 'EOF'
            import json
            with open('/tmp/image_info.json') as f:
                data = json.load(f)
                labels = data.get('image_summary', {}).get('metadata', {}).get('labels', {})
                print(json.dumps(labels, indent=2, sort_keys=True))
            EOF
          
          - echo ""
          - echo "=========================================="
          - echo "Bitbucket Labels Only (JSON Format):"
          - echo "=========================================="
          - |
            python3 << 'EOF'
            import json
            with open('/tmp/image_info.json') as f:
                data = json.load(f)
                labels = data.get('image_summary', {}).get('metadata', {}).get('labels', {})
                bitbucket_labels = {k: v for k, v in labels.items() if k.startswith('bitbucket')}
                print(json.dumps(bitbucket_labels, indent=2, sort_keys=True))
            EOF

          # Get GKE credentials
          - echo "=========================================="
          - echo "Deploying to GKE..."
          - echo "=========================================="
          - export USE_GKE_GCLOUD_AUTH_PLUGIN=True
          - gcloud container clusters get-credentials $GKE_CLUSTER --zone $GKE_REGION --project $GCP_PROJECT

          # Deploy to Kubernetes
          - kubectl apply -f k8s/namespace.yaml --validate=false
          - sed "s|REPLACE_WITH_IMAGE|$IMAGE_URI|g" k8s/deployment.yaml | kubectl apply -f -
          - kubectl apply -f k8s/service.yaml
          - kubectl apply -f k8s/hpa.yaml
          
          - echo "=========================================="
          - echo "✅ Deployment completed successfully!"
          - echo "=========================================="

definitions:
  services:
    docker:
      memory: 3072