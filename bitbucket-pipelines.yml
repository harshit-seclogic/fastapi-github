image: google/cloud-sdk:latest

pipelines:
  default:
    - step:
        name: Build Image and Generate SBOM
        services:
          - docker
        caches:
          - docker
        script:
          # Authenticate with GCP
          - echo "$GCP_SA_KEY" | base64 --decode > gcp-key.json
          - gcloud auth activate-service-account --key-file=gcp-key.json
          - gcloud config set project "$GCP_PROJECT"
          - gcloud auth configure-docker ${GAR_LOCATION}-docker.pkg.dev -q

          # Build and tag image
          - export IMAGE_URI="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT}/${GAR_REPO}/${IMAGE_NAME}:${BITBUCKET_COMMIT}"
          - 'echo "Building Docker image: $IMAGE_URI"'
          - docker build -t $IMAGE_URI .

          # Generate SBOM
          - echo "Generating SBOM from built image..."
          - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:latest "$IMAGE_URI" -o json > sbom.json

          # Upload SBOM
          - pipe: atlassian/bitbucket-upload-file:1.2.0
            variables:
              BITBUCKET_USERNAME: $BITBUCKET_USERNAME
              BITBUCKET_APP_PASSWORD: $BITBUCKET_APP_PASSWORD
              FILENAME: 'sbom.json'

          # Push image early so Checkmarx can access it
          - echo "Pushing image to GAR..."
          - docker push "$IMAGE_URI"

    - step:
        name: Security Scans
        image: checkmarx/ast-cli:latest  # Critical: Use Checkmarx CLI image
        services:
          - docker
        script:
          # Download SBOM
          - pipe: atlassian/bitbucket-download-file:1.2.0
            variables:
              FILENAME: 'sbom.json'

          # Container Image Scan
          - echo "Running Checkmarx container scan..."
          - >
            /app/bin/cx scan create
            --project-name "$BITBUCKET_REPO_SLUG"
            --branch "$BITBUCKET_BRANCH"
            --base-uri "$CHECKMARX_BASE_URI"
            --base-auth-uri "$CHECKMARX_BASE_AUTH_URI"
            --tenant "$CHECKMARX_TENANT"
            --apikey "$API_KEY"
            --agent "Bitbucket"
            --scan-types container
            --container-image "$IMAGE_URI"
            --sbom-path sbom.json
            --async

          # Source Code Scans (SAST, SCA, etc.)
          - echo "Running Checkmarx SAST/SCA/KICS scans..."
          - >
            /itespace/app/bin/cx scan create
            -s .
            --project-name "$BITBUCKET_REPO_SLUG"
            --branch "$BITBUCKET_BRANCH"
            --base-uri "$CHECKMARX_BASE_URI"
            --base-auth-uri "$CHECKMARX_BASE_AUTH_URI"
            --tenant "$CHECKMARX_TENANT"
            --apikey "$API_KEY"
            --agent "Bitbucket"
            --scan-types sast,sca,kics,apisec,scs
            --async

    - step:
        name: Deploy to GKE
        services:
          - docker
        caches:
          - docker
        script:
          # Get GKE credentials
          - export USE_GKE_GCLOUD_AUTH_PLUGIN=True
          - gcloud container clusters get-credentials "$GKE_CLUSTER" --zone "$GKE_ZONE" --project "$GCP_PROJECT"

          # Deploy
          - kubectl apply -f k8s/namespace.yaml --validate=false
          - sed "s|REPLACE_WITH_IMAGE|$IMAGE_URI|g" k8s/deployment.yaml | kubectl apply -f -
          - kubectl apply -f k8s/service.yaml
          - kubectl apply -f k8s/hpa.yaml

definitions:
  services:
    docker:
      memory: 3072