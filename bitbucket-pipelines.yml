image: google/cloud-sdk:latest

pipelines:
  default:
    - step:
        name: Build Image and Generate SBOM
        services:
          - docker
        caches:
          - docker
        script:
          # GCP Auth
          - echo "$GCP_SA_KEY" | base64 --decode > gcp-key.json
          - gcloud auth activate-service-account --key-file=gcp-key.json
          - gcloud config set project "$GCP_PROJECT"
          - gcloud auth configure-docker ${GAR_LOCATION}-docker.pkg.dev -q

          # Build image
          - export IMAGE_URI="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT}/${GAR_REPO}/${IMAGE_NAME}:${BITBUCKET_COMMIT}"
          - 'echo "Building Docker image: ${IMAGE_URI}"'
          - docker build -t "${IMAGE_URI}" .

          # Generate SBOM from local Docker daemon (BEFORE pushing)
          - echo "Generating SBOM from local image..."
          - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:latest "docker:${IMAGE_URI}" -o json > sbom.json
          
          # Verify SBOM was created
          - ls -lh sbom.json
          - echo "SBOM generated successfully"

          # Push image to registry
          - echo "Pushing image to Artifact Registry..."
          - docker push "${IMAGE_URI}"

        artifacts:
          - sbom.json   # Available for next steps

    - step:
        name: Security Scans
        image: checkmarx/ast-cli:latest
        services:
          - docker
        script:
          - echo "Using SBOM file:"
          - ls -la sbom.json

          # Container Scan
          - echo "Running Checkmarx container scan..."
          - >
            /app/bin/cx scan create
            --project-name "$BITBUCKET_REPO_SLUG"
            --branch "$BITBUCKET_BRANCH"
            --base-uri "$CHECKMARX_BASE_URI"
            --base-auth-uri "$CHECKMARX_BASE_AUTH_URI"
            --tenant "$CHECKMARX_TENANT"
            --apikey "$API_KEY"
            --agent "Bitbucket"
            --scan-types container
            --container-image "$IMAGE_URI"
            --sbom-path sbom.json
            --async

          # Source Code Scan
          - echo "Running SAST/SCA scans..."
          - >
            /app/bin/cx scan create
            -s .
            --project-name "$BITBUCKET_REPO_SLUG"
            --branch "$BITBUCKET_BRANCH"
            --base-uri "$CHECKMARX_BASE_URI"
            --base-auth-uri "$CHECKMARX_BASE_AUTH_URI"
            --tenant "$CHECKMARX_TENANT"
            --apikey "$API_KEY"
            --agent "Bitbucket"
            --scan-types sast,sca,kics,apisec,scs
            --async

    - step:
        name: Deploy to GKE
        image: google/cloud-sdk:latest
        services:
          - docker
        script:
          # Re-authenticate for GKE step
          - echo "$GCP_SA_KEY" | base64 --decode > gcp-key.json
          - gcloud auth activate-service-account --key-file=gcp-key.json
          - gcloud config set project "$GCP_PROJECT"
          
          # GKE Deployment
          - export USE_GKE_GCLOUD_AUTH_PLUGIN=True
          - export IMAGE_URI="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT}/${GAR_REPO}/${IMAGE_NAME}:${BITBUCKET_COMMIT}"
          - gcloud container clusters get-credentials "$GKE_CLUSTER" --zone "$GKE_ZONE" --project "$GCP_PROJECT"
          - kubectl apply -f k8s/namespace.yaml --validate=false
          - sed "s|REPLACE_WITH_IMAGE|${IMAGE_URI}|g" k8s/deployment.yaml | kubectl apply -f -
          - kubectl apply -f k8s/service.yaml
          - kubectl apply -f k8s/hpa.yaml

definitions:
  services:
    docker:
      memory: 3072