image: google/cloud-sdk:latest

pipelines:
  default:
    - step:
        name: Build and Deploy to GKE
        services:
          - docker
        caches:
          - docker
        script:
          # Decode and authenticate with GCP
          - echo $GCP_SA_KEY | base64 --decode > gcp-key.json
          - gcloud auth activate-service-account --key-file=gcp-key.json
          - gcloud config set project $GCP_PROJECT
          - gcloud auth configure-docker ${GAR_LOCATION}-docker.pkg.dev -q

          # Build Docker image with Bitbucket metadata
          - export IMAGE_URI="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT}/${GAR_REPO}/${IMAGE_NAME}:${BITBUCKET_COMMIT}"
          - export BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - 'echo "Building Docker image: $IMAGE_URI"'
          - 'echo "Build Date: $BUILD_DATE"'
          - |
            docker build \
              --label "bitbucket.repo.slug=${BITBUCKET_REPO_SLUG}" \
              --label "bitbucket.repo.full.name=${BITBUCKET_REPO_FULL_NAME}" \
              --label "bitbucket.workspace=${BITBUCKET_WORKSPACE}" \
              --label "bitbucket.branch=${BITBUCKET_BRANCH}" \
              --label "bitbucket.commit.sha=${BITBUCKET_COMMIT}" \
              --label "bitbucket.commit.author=${BITBUCKET_COMMIT_AUTHOR:-unknown}" \
              --label "bitbucket.build.number=${BITBUCKET_BUILD_NUMBER}" \
              --label "bitbucket.pipeline.uuid=${BITBUCKET_PIPELINE_UUID}" \
              --label "bitbucket.repo.url=https://bitbucket.org/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}" \
              --label "build.date=${BUILD_DATE}" \
              -t $IMAGE_URI \
              .
          
          # Verify labels were added (show in pipeline logs)
          - echo "=========================================="
          - echo "Verifying Bitbucket Metadata Labels"
          - echo "=========================================="
          - docker inspect $IMAGE_URI --format='{{range $key, $value := .Config.Labels}}{{$key}}={{$value}}{{println}}{{end}}'
          - echo "=========================================="
          
          # Push image to Artifact Registry
          - docker push $IMAGE_URI
          - echo "✅ Image pushed successfully to GAR"
          - echo "Image URI:" $IMAGE_URI
          - echo ""
          - echo "To inspect metadata after deployment, run:"
          - echo "  docker pull $IMAGE_URI"
          - echo "  docker inspect $IMAGE_URI --format='{{json .Config.Labels}}' | python3 -m json.tool"

          # Get GKE credentials
          - export USE_GKE_GCLOUD_AUTH_PLUGIN=True
          - gcloud container clusters get-credentials $GKE_CLUSTER --zone $GKE_REGION --project $GCP_PROJECT

          # Deploy to Kubernetes
          - kubectl apply -f k8s/namespace.yaml --validate=false
          - sed "s|REPLACE_WITH_IMAGE|$IMAGE_URI|g" k8s/deployment.yaml | kubectl apply -f -
          - kubectl apply -f k8s/service.yaml
          - kubectl apply -f k8s/hpa.yaml
          
          - echo "=========================================="
          - echo "Deployment Complete!"
          - echo "Image with metadata:" $IMAGE_URI
          - echo "=========================================="

definitions:
  services:
    docker:
      memory: 3072