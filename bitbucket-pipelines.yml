image: google/cloud-sdk:latest

pipelines:
  default:
    - step:
        name: Build and Deploy to GKE
        services:
          - docker
        caches:
          - docker
        script:
          - 'echo $GCP_SA_KEY | base64 --decode > gcp-key.json'
          - 'gcloud auth activate-service-account --key-file=gcp-key.json'
          - 'gcloud config set project $GCP_PROJECT'
          - 'gcloud auth configure-docker ${GAR_LOCATION}-docker.pkg.dev -q'

          - 'export IMAGE_URI="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT}/${GAR_REPO}/${IMAGE_NAME}:${BITBUCKET_COMMIT}"'
          - 'bash -lc "echo Building Docker image: $IMAGE_URI"'
          - 'bash -lc "docker build -t $IMAGE_URI ."'
          - 'bash -lc "docker push $IMAGE_URI"'

          - 'bash -lc "export USE_GKE_GCLOUD_AUTH_PLUGIN=True && gcloud container clusters get-credentials $GKE_CLUSTER --zone $GKE_ZONE --project $GCP_PROJECT"'

          - 'bash -lc "kubectl apply -f k8s/namespace.yaml --validate=false"'
          - 'bash -lc "sed \"s|REPLACE_WITH_IMAGE|$IMAGE_URI|g\" k8s/deployment.yaml | kubectl apply -f -"' 
          - 'bash -lc "kubectl apply -f k8s/service.yaml"'
          - 'bash -lc "kubectl apply -f k8s/hpa.yaml"'

definitions:
  services:
    docker:
      memory: 3072
