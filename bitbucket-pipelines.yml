image: google/cloud-sdk:latest

pipelines:
  default:
    - step:
        name: Build and Deploy to GKE
        services:
          - docker
        caches:
          - docker
        script:
          # Authenticate with GCP
          - echo $GCP_SA_KEY > gcp-key.json
          - gcloud auth activate-service-account --key-file=gcp-key.json
          - gcloud config set project $GCP_PROJECT
          - gcloud auth configure-docker ${GAR_LOCATION}-docker.pkg.dev -q

          # Build and push Docker image
          - IMAGE_URI="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT}/${GAR_REPO}/${IMAGE_NAME}:${BITBUCKET_COMMIT}"
          - docker build -t $IMAGE_URI .
          - docker push $IMAGE_URI

          # Get GKE credentials
          - export USE_GKE_GCLOUD_AUTH_PLUGIN=True
          - gcloud container clusters get-credentials $GKE_CLUSTER --zone $GKE_ZONE --project $GCP_PROJECT

          # Deploy to Kubernetes
          - kubectl apply -f k8s/namespace.yaml
          - sed "s|IMAGE_PLACEHOLDER|$IMAGE_URI|g" k8s/deployment.yaml | kubectl apply -f -
          - kubectl apply -f k8s/service.yaml
          - kubectl apply -f k8s/hpa.yaml

definitions:
  services:
    docker:
      memory: 3072
