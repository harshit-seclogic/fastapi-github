version: "1.0"

application:
  name: "bookstore-app"
  url: "http://app"  # service name inside GitHub Actions
  apiUrl: "http://app/openapi.json"

authentication:
  method: "cookie"
  loginUrl: "http://app/login"
  usernameField: "username"
  passwordField: "password"
  username: "testuser"
  password: "testpass"

scanner:
  type: "zap"
  policies:
    - "API-Security"
    - "Injection"
    - "XSS"

output:
  format:
    - "json"
    - "html"
  directory: "/results"
