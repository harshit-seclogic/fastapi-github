name: RapiDAST Security Scan + Build & Deploy to EKS

on:
  pull_request:
  push:
    branches:
      - hf

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPO: fastapi-github
  ECR_REGISTRY: 941086635353.dkr.ecr.ap-south-1.amazonaws.com
  CLUSTER_NAME: disco-dog
  NAMESPACE: fastapi

# ----------------------------------------------------
# 1) RapiDAST Security Scan Job
# ----------------------------------------------------

jobs:
  rapidast-scan:
    name: 🔒 RapiDAST Security Scan
    runs-on: ubuntu-latest

    container:
      image: quay.io/redhatproductsecurity/rapidast:latest
      options: --user root
      volumes:
        - ${{ github.workspace }}:/workspace  # Mount repo inside container

    services:
      app:
        image: docker.io/httpd:latest   # Replace with your app container if needed
        ports:
          - 80:80

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Files (Debug)
        run: |
          echo "📁 Workspace files inside container:"
          ls -al /workspace

      - name: Run RapiDAST Scan
        run: |
          cd /workspace
          rapidast.py --config rapidast-config.yml
          echo "----- ZAP Results -----"
          cat results/*/*/zap/zap-report.json || true

      - name: Upload RapiDAST Results
        uses: actions/upload-artifact@v4
        with:
          name: rapidast-results
          path: results/*/*/*

# ----------------------------------------------------
# 2) Build & Push Docker Image
# ----------------------------------------------------

  build-and-push:
    name: 🏗️ Build & Push to ECR
    runs-on: ubuntu-latest
    needs: rapidast-scan   # ← Security gate (build only if scan passed)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Image Metadata
        run: |
          echo "IMAGE_URI=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build \
            --label "github.repo=${{ github.repository }}" \
            --label "github.actor=${{ github.actor }}" \
            --label "github.sha=${{ github.sha }}" \
            --label "build.date=${BUILD_DATE}" \
            -t $IMAGE_URI .

      - name: Push Docker Image
        run: |
          docker push $IMAGE_URI
          echo $IMAGE_URI > image_uri.txt

      - name: Upload Image URI
        uses: actions/upload-artifact@v4
        with:
          name: image_uri
          path: image_uri.txt

# ----------------------------------------------------
# 3) Deploy to EKS
# ----------------------------------------------------

  deploy:
    name: 🚢 Deploy to AWS EKS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Image URI
        uses: actions/download-artifact@v4
        with:
          name: image_uri

      - name: Export Image URI
        run: |
          echo "IMAGE_URI=$(cat image_uri.txt)" >> $GITHUB_ENV

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

          kubectl get nodes

      - name: Deploy to Kubernetes
        run: |
          echo "Deploying image: $IMAGE_URI"

          kubectl apply -f k8s/namespace.yaml --validate=false

          sed "s|REPLACE_WITH_IMAGE|$IMAGE_URI|g" k8s/deployment.yaml | kubectl apply -f -

          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

          echo "🎉 Deployment Successful!"
