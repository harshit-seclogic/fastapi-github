name: RapiDAST Security Scan + Build & Deploy to EKS

on:
  pull_request:
  push:
    branches:
      - hf

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPO: fastapi-github
  ECR_REGISTRY: 941086635353.dkr.ecr.ap-south-1.amazonaws.com
  CLUSTER_NAME: disco-dog
  NAMESPACE: fastapi

jobs:

  # ----------------------------------------------------
  # 1) RapiDAST Scan
  # ----------------------------------------------------
  rapidast-scan:
    name: 🔒 RapiDAST Security Scan
    runs-on: ubuntu-latest

    container:
      image: quay.io/redhatproductsecurity/rapidast:latest
      options: --user root

    services:
      app:
        image: docker.io/httpd:latest
        ports:
          - 80:80

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Debug — Show Files
        run: |
          echo "Files inside workspace:"
          ls -al

      - name: Debug — Show RapiDAST Config
        run: |
          echo "========= rapidast-config.yml ========="
          cat rapidast-config.yml
          echo "======================================="

      - name: Run RapiDAST
        run: |
          rapidast.py --config rapidast-config.yml || true
          cat results/*/*/zap/zap-report.json || true

      - name: Upload Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: rapidast-results
          path: results/*/*/*

  # ----------------------------------------------------
  # 2) Build & Push Docker Image
  # ----------------------------------------------------
  build-and-push:
    name: 🏗️ Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: rapidast-scan   # ✅ FIXED name

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Metadata
        run: |
          echo "IMAGE_URI=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build Image
        run: |
          docker build -t $IMAGE_URI .

      - name: Push Image
        run: |
          docker push $IMAGE_URI
          echo $IMAGE_URI > image_uri.txt

      - name: Upload Image URI
        uses: actions/upload-artifact@v4
        with:
          name: image_uri
          path: image_uri.txt

  # ----------------------------------------------------
  # 3) Deploy to EKS
  # ----------------------------------------------------
  deploy:
    name: 🚢 Deploy to AWS EKS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/download-artifact@v4
        with:
          name: image_uri

      - name: Load Image URI
        run: echo "IMAGE_URI=$(cat image_uri.txt)" >> $GITHUB_ENV

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}
          kubectl get nodes

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml --validate=false
          sed "s|REPLACE_WITH_IMAGE|$IMAGE_URI|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

          echo "🎉 Deployment Successful!"
