name: Build and Deploy to AWS EKS (disco-dog)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPO: fastapi-github
  CLUSTER_NAME: disco-dog
  ECR_REGISTRY: 941086635353.dkr.ecr.ap-south-1.amazonaws.com
  NAMESPACE: default

jobs:
  build-and-push:
    name: 🏗️ Build and Push Docker Image to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Environment Variables
        run: |
          echo "IMAGE_URI=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${GITHUB_SHA}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: 🚀 Build Docker Image with Metadata Labels
        run: |
          docker build \
            --label "github.repo=${{ github.repository }}" \
            --label "github.actor=${{ github.actor }}" \
            --label "github.sha=${GITHUB_SHA}" \
            --label "build.date=${BUILD_DATE}" \
            -t $IMAGE_URI .

      - name: 🔍 Verify Metadata Labels
        run: |
          echo "=========================================="
          docker inspect $IMAGE_URI --format='{{range $key, $value := .Config.Labels}}{{$key}}={{$value}}{{println}}{{end}}'
          echo "=========================================="

      - name: Push Docker Image to ECR
        run: |
          docker push $IMAGE_URI
          echo "✅ Image pushed successfully: $IMAGE_URI"
          echo $IMAGE_URI > image_uri.txt

      - name: Upload image URI artefact
        uses: actions/upload-artifact@v4
        with:
          name: image_uri
          path: image_uri.txt

  deploy:
    name: 🚢 Deploy to EKS (disco-dog)
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl for EKS
        run: |
          aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_REGION

      - name: Download image URI
        uses: actions/download-artifact@v4
        with:
          name: image_uri

      - name: Read Image URI
        run: echo "IMAGE_URI=$(cat image_uri.txt)" >> $GITHUB_ENV

      - name: Apply Kubernetes Manifests
        run: |
          echo "Deploying image: $IMAGE_URI"
          kubectl apply -f k8s/namespace.yaml --validate=false
          sed "s|REPLACE_WITH_IMAGE|$IMAGE_URI|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

          echo "=========================================="
          echo "✅ Deployment Complete!"
          echo "Cluster: disco-dog"
          echo "Image Deployed: $IMAGE_URI"
          echo "=========================================="
