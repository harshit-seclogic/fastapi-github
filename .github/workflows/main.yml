name: RapiDAST + Build and Deploy to AWS EKS (disco-dog)

on:
  pull_request:
  push:
    branches:
      - hf

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPO: fastapi-github
  CLUSTER_NAME: disco-dog
  ECR_REGISTRY: 941086635353.dkr.ecr.ap-south-1.amazonaws.com
  NAMESPACE: fastapi

# -----------------------------------------
# 1) RapiDAST Security Scan Job
# -----------------------------------------

jobs:
  rapidast-scan:
    name: 🔒 RapiDAST Security Scan
    runs-on: ubuntu-latest
    container:
      image: quay.io/redhatproductsecurity/rapidast:latest
      options: --user root

    services:
      httpd:
        image: docker.io/httpd:latest

    steps:
      - uses: actions/checkout@v4

      - name: Run RapiDAST
        run: |
          rapidast.py --config rapidast-config.yml
          echo "----- ZAP Results -----"
          cat results/*/*/zap/zap-report.json || true

      - name: Upload RapiDAST Results
        uses: actions/upload-artifact@v4
        with:
          name: rapidast-results
          path: results/*/*/*

# -----------------------------------------
# 2) Build and Push Docker Image
# -----------------------------------------

  build-and-push:
    name: 🏗️ Build & Push Docker Image to ECR
    runs-on: ubuntu-latest
    needs: rapidast-scan   # ⬅️ SECURITY GATE: Only build if scan is successful

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Metadata
        run: |
          echo "IMAGE_URI=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build \
            --label "github.repo=${{ github.repository }}" \
            --label "github.actor=${{ github.actor }}" \
            --label "github.sha=${{ github.sha }}" \
            --label "build.date=${BUILD_DATE}" \
            -t $IMAGE_URI .

      - name: Push Docker Image to ECR
        run: |
          docker push $IMAGE_URI
          echo $IMAGE_URI > image_uri.txt

      - name: Upload image URI artifact
        uses: actions/upload-artifact@v4
        with:
          name: image_uri
          path: image_uri.txt

# -----------------------------------------
# 3) Deploy to EKS
# -----------------------------------------

  deploy:
    name: 🚢 Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download image URI
        uses: actions/download-artifact@v4
        with:
          name: image_uri

      - name: Read Image URI
        run: echo "IMAGE_URI=$(cat image_uri.txt)" >> $GITHUB_ENV

      - name: Setup kubectl for EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
          kubectl get nodes

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/namespace.yaml --validate=false
          sed "s|REPLACE_WITH_IMAGE|$IMAGE_URI|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

          echo "Deployment completed to EKS"
