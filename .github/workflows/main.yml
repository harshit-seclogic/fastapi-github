name: Private URL Access Test

on:
  workflow_dispatch:

jobs:
  test-access:
    runs-on: ubuntu-latest

    steps:
    - name: Try accessing private URL
      run: |
        URL="https://example.com/private-endpoint"

        echo "Testing access to Private URL..."

        STATUS=$(curl -u "${PRIVATE_USERNAME}:${PRIVATE_PASSWORD}" \
          -o /dev/null -s -w "%{http_code}" "$URL")

        echo "HTTP Status: $STATUS"

        if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
          echo "✅ Access successful!"
        else
          echo "❌ Access failed!"
          exit 1
        fi
      env:
        PRIVATE_USERNAME: ayushi@seclogic.io
        PRIVATE_PASSWORD: mikku@19
