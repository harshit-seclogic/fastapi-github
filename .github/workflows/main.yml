name: RapiDAST Security Scan + Build & Deploy to EKS

on:
  pull_request:
  push:
    branches:
      - hf

permissions:
  contents: read
  id-token: write

# env:
#   AWS_REGION: ap-south-1
#   ECR_REPO: fastapi-github
#   ECR_REGISTRY: 941086635353.dkr.ecr.ap-south-1.amazonaws.com
#   CLUSTER_NAME: disco-dog
#   NAMESPACE: fastapi

jobs:
  dast:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run RapiDAST
      run: |
        docker run --rm \
          -v ${{ github.workspace }}/rapiddast:/rapiddast \
          quay.io/redhatproductsecurity/rapiddast:latest \
          rapiddast scan -c /rapiddast/config.yaml \
          --output /rapiddast/report

    - name: Upload Report
      uses: actions/upload-artifact@v4
      with:
        name: dast-report
        path: rapiddast/report/
