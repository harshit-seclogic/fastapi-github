configVersion: "2.0"

application:
  name: "bookstore-app"
  url: "http://app:80"
  apiScan:
    openApiUrl: "http://app:80/openapi.json"

authentication:
  method: "cookie"
  login:
    url: "http://app:80/login"
    usernameField: "username"
    passwordField: "password"
    username: "testuser"
    password: "testpass"

scanner:
  zap:
    enabled: true
    policies:
      - "API-Security"
      - "Injection"
      - "XSS"
    apiScan: true
    spider: true
    spiderAjax: true

results:
  output:
    formats:
      - json
      - html
    directory: "results"
